workflows:
  android-homecraft-apk:
    name: HomeCraft Android Organizer APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.homecraft.organizer"
    scripts:
      - name: Install Gradle 8.9 & Bootstrap Wrapper
        script: |
          cd android-app
          if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9.zip
            unzip -q -o /tmp/gradle-8.9.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x gradlew
      - name: Set Android SDK location & Accept Licenses
        script: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_DIR" > "$CM_BUILD_DIR/android-app/local.properties"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Run Android Unit Tests
        script: |
          cd android-app
          ./gradlew testDebugUnitTest --no-daemon
      - name: Build Debug & Release APKs
        script: |
          cd android-app
          ./gradlew assembleDebug assembleRelease --no-daemon
    artifacts:
      - android-app/app/build/outputs/apk/**/*.apk
      - android-app/app/build/outputs/bundle/**/*.aab
      - android-app/app/build/outputs/mapping/**/mapping.txt
